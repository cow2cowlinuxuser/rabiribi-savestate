D3D9SW_REWIND_GAMEHEAP=1
D3D9SW_REWIND_SWHEAP=0
D3D9SW_REWIND_ALLHEAPS=2
D3D9SW_HEAPBLOCKS=1
# Read directly by the savestate engine from the working directory, beside
# the log. This exists because the engine's knobs were arriving only via the
# D3D11 wrapper seeding them into the process environment from d3d11_sw.cfg,
# and that chain was silently dropping most of them - D3D9SW_HEAPBLOCKS read
# as unset for three runs while the config said 1. One file, one reader.

# Was 0, inherited from OSFE where holding our heap in the present was measured
# to cost only stale cache. That reasoning assumed the game never lets go of a
# resource: uploaded textures stay uploaded, the game's pointers still resolve.
# A room transition breaks the assumption. Rabi-Ribi releases the old room's
# textures on the way out, so our objects are destroyed and their memory reused
# in the present, and a restore hands the game back handles to resources that no
# longer exist. Which is exactly what it looks like - counters, text and effects
# return because they are plain data on the game's own heap, while the room
# comes back as a bare background layer. Title-screen restores were clean
# because nothing was released in between.
D3D9SW_REACH_AUDIT=0
D3D9SW_BLKOWNER=3
D3D9SW_CLOBBER=100
D3D9SW_CATCH=0
D3D9SW_SYSROOT=1
D3D9SW_DERIVED=0
D3D9SW_FREEZE=0
D3D9SW_PROBE=0
D3D9SW_WATCH=0
# Was 3000: a diagnostic that refused NtCreateThreadEx for three seconds after
# every restore, to find out what depended on new threads. It answered that, and
# then stayed on. In the 21:51 run it denied eight thread creations to KERNELBASE
# while we were judging stability, which means we were measuring our own
# interference. Off.
D3D9SW_NOTHREAD=0
D3D9SW_REWIND_CLOCK=1

# Fingerprints every committed region at save and re-checks after restore.
# The only check that can see memory we do NOT capture.
D3D9SW_COVERAGE=0
D3D9SW_VERIFY=0
# Restore only the bytes that actually differ from what is live. Measured: a
# thirty second play window changes 5 MB of 62 MB, and six of nine heaps stay
# bit-for-bit identical, so most of a wholesale restore rewrites bytes that
# already hold the value being written. Set to 0 for the old wholesale copy.
D3D9SW_DIFFWRITE=1

# Heap partitioning. Mode 0 (the default we were on) keeps only heaps owned by
# modules we rewind and leaves the rest in the present - and the post-restore
# coverage report showed that splitting the GAME's own allocator set: heaps
# 01980000 and 0D0C0000 rewound while 03900000 and 0DC90000 were held, with the
# game writing to both. Mode 1 rewinds everything including ntdll's own lists.
# Mode 2 is the documented seam: every heap except the ones Windows keeps its
# lists in.

# The LFH keeps state in private allocations OUTSIDE the segments it manages,
# and those were being held in the present unconditionally. With ALLHEAPS=2
# every segment now travels, so holding that metadata is itself the split:
# present-time bookkeeping describing past-time blocks. The allocator divides
# by fields in it, which is why the crash became C0000094 (divide by zero) in
# ntdll rather than an access violation. 0 rewinds it with everything else.
D3D9SW_LFHHOLD=1
D3D9SW_CARRY=1
D3D9SW_PARK_MS=100000
D3D9SW_HELDVETO=1

# Give the game a heap of its own, and the reason DDPR is easy.
#
# Rabi-Ribi links ucrtbase, which does not create a heap - it calls
# GetProcessHeap and allocates alongside ntdll, GDI and combase. That single
# fact is why BLKOWNER, HELDVETO, VTABVETO and the recycled-block hazard exist:
# the game's blocks and Windows' are interleaved in one arena and every restore
# has to guess. DDPR links MSVCR100, which calls HeapCreate, and its restore
# reported 208 regions with none by block and 98.8% of the process captured.
#
# This creates a heap and redirects the executable's imports of malloc, calloc,
# realloc, free, _msize, _recalloc and _expand into it. Anything allocated
# before the redirect stays where it was and free dispatches by ownership, so
# the mixed period is correct rather than lucky. Allocations over 256 KB stay
# with the runtime on purpose.
#
# Set to 0 to put the game's memory back where it was.
D3D9SW_GAMEHEAP=1

D3D9SW_SLOTFILE=1

D3D9SW_REWIND_NEWTHREADS=refuse

D3D9SW_INFRA_PAYLOAD=0

# Diagnostics, all off. Each costs time on every save or frame when enabled:
# WATCH_AT logs the floats at given offsets from the player entity, WATCH_TRACE
# follows them for N frames after a save or restore, GHTRACE records the first N
# allocator operations to gh_trace.txt, and DELTA hashes every chunk to report
# how much actually changed between saves.
D3D9SW_WATCH_AT=
D3D9SW_EXCLSKIP=1

D3D9SW_WATCH_TRACE=0

D3D9SW_GHTRACE=0

D3D9SW_DELTA=0

# Allow a restore taken in a different world. It faults immediately: a world
# transition frees and reallocates heap blocks, so a restored pointer can land
# in memory that now holds something else. Left here to be experimented with,
# not because it works.
D3D9SW_CROSSWORLD=0

# Cover the monitor at its real resolution and do the upscale ourselves, rather
# than dropping the desktop to 1280x720 and letting the panel scale. point is
# nearest-neighbour; integer keeps the factor whole, which on a 2560x1440
# display is an exact 2x with no bars.
D3D11SW_BORDERLESS=1
D3D11SW_SCALE=point,integer

# Which keys save and restore.
#
# Written one of three ways: a single character is that key ("1", "A"), F
# followed by a number is the function row ("F5"), and 0x.. is a virtual-key
# code for anything without a name. A bare number is NOT a key code - "1" is
# the digit, because virtual-key 1 is the left mouse button and binding save
# to it by accident would be a bad afternoon.
#
# Leaving LOAD_VK unset keeps the old behaviour: save on the key, restore on
# shift plus the same key. That is fine for a person and no good for a script.
# A modifier has to still be held when the second key is read, and neither
# Wine's input path nor a remote driver reproduces that overlap reliably, which
# is why automated restores were not firing. Giving load a key of its own
# removes the requirement entirely.
#
# 1 and 2 below because Rabi-Ribi and DDPR both leave the number row alone, so
# there is nothing to collide with. Applies to every backend - d3d9, d3d11 and
# gl all resolve through the same place.
D3D9SW_SAVE_VK=1
D3D9SW_LOAD_VK=2

# After a freeze the game misses the KEYUP: the copy is 200-300 ms, which is
# many frames and inside X auto-repeat. Hitch resync runs for 1 s of real time
# after save/load only, and KEYUPs a Left that was released but comes back
# down (stale repeat). Ordinary play does not SendInput. Off with 0.
D3D9SW_KEY_UNSTICK=1

# Linux/Proton CPU-only. tools/linux-rabi.sh deploy writes the same knobs
# next to the exe; they live here so a local harness matches this VM.
D3D11SW_GPU=0
D3D9SW_THREADS=4
D3D9SW_XINPUT=0
# 0 means never. Parsing 0 as frame zero took a save on the first present
# of every launch, which is a 200-300 ms freeze during ordinary play.
D3D9SW_SAVE_AT=0
D3D9SW_LOAD_AT=0
D3D9SW_QUIT_AT=0
