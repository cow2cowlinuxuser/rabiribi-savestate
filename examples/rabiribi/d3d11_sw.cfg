# d3d11_sw settings for Rabi-Ribi.
#
# KEY=VALUE, one per line. Lines starting with # or ; are ignored.
# A real environment variable always wins over anything set here, so you can
# still override any of these from a terminal for a one-off test.
#
# Anything left commented out falls back to the built-in profile for this game.

# --- performance ---------------------------------------------------------
# Render at half resolution and upscale on present. This is the single biggest
# lever over frame time on a CPU rasteriser. Set SCALE_RT=0 to render at full
# resolution instead (sharper, much slower).
D3D11SW_SCALE_RT=0
D3D11SW_MAX_HEIGHT=720

# Frame pacing. The game's logic assumes 60, so raising this makes it run fast.
D3D11SW_VSYNC=1
D3D11SW_FPS_CAP=60

# --- display -------------------------------------------------------------
# Which monitor to open on, as listed in d3d11_sw.log at startup. 0 is the
# primary. Remove this line to leave the window wherever the game puts it.
D3D11SW_MONITOR=0

# On-screen memory readout. F8 toggles it in game regardless of this.
D3D11SW_OSD=0

# --- memory --------------------------------------------------------------
# Share one copy of a texture between the game-facing plane and the rasteriser
# plane instead of keeping two. Roughly halves texture memory, which matters
# because this is a 32-bit process limited to 2 GB.
# Set to 0 if any texture shows up with red and blue swapped.
D3D11SW_DEDUP=1

# Store large sprite atlases at half size on each axis (a quarter of the
# memory). 1 disables, 2 halves, 4 quarters. Only applies to textures the game
# supplies complete at load and can never map.
D3D11SW_TEX_SCALE=2
# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_REWIND_SWHEAP=0
D3D11SW_MARK_EMPTY=0

# Diagnostic: 0 off, 1 all-additive, 2 neutralise multiply draws, 3 neutralise all blends.
D3D11SW_BREAK_BLEND=0

# Diagnostic only: reserves and immediately releases at fixed bases to see
# whether a persistent arena is possible here. Changes no behaviour.
D3D11SW_ARENA_PROBE=1

# Experimental: put every large texture payload in one fixed-base reservation.
# 0 disables. Frees decommit, so memory returns to the OS without fragmenting.
D3D11SW_ARENA_MB=768

# Stop holding released textures for the snapshot once free address space
# falls below this. 0 disables the floor and trusts RETAIN_MB alone.
D3D11SW_RETAIN_FLOOR_MB=384

# Name every module left in the present that holds a pointer into memory
# the restore rewinds - the shape of both crashes so far. Diagnostic only.
# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_REACH_AUDIT=0

# This game allocates from the process heap, so one heap serves both it and
# Windows. Rewinding the whole thing puts back allocator metadata that no longer
# describes what Windows has allocated since; holding it back strands the game's
# own objects and is what makes a restore snap back for one frame and then walk
# forward again.
#
# 1 here does NOT mean the old whole-heap rewind, because HEAPBLOCKS below
# changes what "rewound" does. It means the heap is CAPTURED, which is the
# prerequisite for restoring anything in it. With 0 the segments are excluded
# from the snapshot, so the block restore has no saved bytes to draw on and
# silently does nothing - measured: 14279 of 14472 blocks skipped, 10 KB written.
# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_REWIND_GAMEHEAP=1

# The way out of that trade. Rather than rewinding the heap's pages, which
# takes the allocator's own lists back with them, walk it and restore only the
# busy blocks - the contents the game allocated, with the bookkeeping around
# them left in the present where Windows can still trust it.
#
# The blocks are the game's stranded state. Holding the heap back is what makes
# a restore snap to the save point for one frame and then walk back: the image
# and the arenas rewind, the entities on this heap do not, and the next update
# tick reads the live ones.
# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_HEAPBLOCKS=1

# One heap serves the game and Windows both, so not every block on it is the
# game's, and restoring one of Windows' is fatal - measured: a GDI font-cache
# block put back with stale bytes, then ntdll's corruption analyzer wedged
# inside the heap lock with every other thread queued behind it.
#
# 1 rejects only blocks that positively look like Windows' - measured: waved a
#   GDI font-cache block through, 2482 blocks restored, then the hang above.
# 2 also rejects blocks it cannot identify - measured: rejected 3686, wrote only
#   229 blocks, no corruption but the restore drifts again.
# 3 stops guessing. A block is the game's if the game can reach it: walk every
#   pointer from the game's image, arenas and stacks into the shared heap, then
#   through those blocks transitively. Contents cannot distinguish a font cache
#   from a game object, but who points at it can.
# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_BLKOWNER=4

# Survive faults that would crash. A runaway rep movs/stos gets its count set
# to zero so the copy ends instead of walking the address space - reads and
# writes both, since the loop faults on whichever end runs out first. Reads
# that land in reserved space also get a zero page invented for them; writes
# never do. The number is the cap; after it the guard stands down. 0 = off.
# Off deliberately. The guard invents memory to survive a fault, and the last
# crash showed what that costs: it committed a zero page for a read of reserved
# address 70DB1303, the code then jumped there, and the resulting "execute of
# committed data" sent us looking for an unmapped DLL that never existed. With
# it off, a bad pointer faults where it is actually wrong, and a restore that
# holds is holding on its own.
D3D11SW_HEAL=0

# Milliseconds after a restore to re-check the regions we wrote, naming
# whatever the un-rewound threads put back over them. 0 disables.
# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_CLOBBER=300

# Lists every committed private region >=1 MB with the capture decision
# spelled out. Diagnostic; walks the address space inside the suspend.
#D3D9SW_REGION_AUDIT=1  # answered: the 232 MB at 20000000 is ours

# Arm this many guard pages after a restore, on the addresses that had
# drifted. First thread to touch one is named with its instruction pointer.
# Off while reachability is under test. It rewrites page protections right after
# a restore, which is one more thing happening in the window where a corrupted
# code pointer showed up, and its answers are not what we are short of now.
# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_CATCH=1

# Experiment knobs, re-read on every restore so they can be edited while the
# game runs. Comma-separated region base addresses in hex.
#   SKIPREG  - restore everything except these (region keeps its live value)
#   SCRIBBLE - restore these, then fill with 0xCD
#   "auto" means whatever the last clobber check called REVERTED, so the first
#   restore of a session is a normal baseline and every later one holds those
#   regions back. Saves reading hex out of the log, which is worthless across
#   launches anyway because the bases move.
# Off for the heap-block test: from the second restore on it holds back a 32 MB
# arena, which is too big a change to have running alongside another one.
# D3D9SW_SKIPREG=auto
# D3D9SW_SCRIBBLE=

# moved to d3d9_sw.cfg, which owns the savestate knobs: D3D9SW_SYSROOT=1

# Linux/Proton CPU-only. Do not restore against the live GPU backend.
D3D11SW_GPU=0
